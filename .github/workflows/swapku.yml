# SwapKu v1 CI — written fresh for bastian57/swapku-app.
# Place this file at .github/workflows/swapku.yml in the repo.
# It is NOT a Termux push block and it does not create a repo.
#
# Pattern (SuaraKu-proven, workspace keystore only):
# 1. Decode secret KEYSTORE_B64 to workspace signing/swapku-tetap.keystore.
# 2. HARD GATE: keystore SHA-256 fingerprint must equal the Putra keystore
#    fingerprint below, or the build stops before compiling.
# 3. Build the debug APK with Gradle 8.7 + JDK 17.
# 4. HARD GATE: APK certificate SHA-256 must equal the Putra certificate
#    below, or nothing is published.
# 5. build.log is uploaded to the build-log release on every run, even
#    on failure (if: always()).
# 6. On success, the APK is published to the rolling "latest" release
#    as SwapKu-v1.0.0.apk, so updates install over the previous build.
name: SwapKu Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_KEYSTORE_FP: "0A:A5:2A:F9:10:17:42:AE:5D:5A:13:80:F7:F2:E8:A4:F1:F5:88:03:80:6F:B6:09:43:72:D3:3C:78:10:30:20"
  EXPECTED_APK_CERT: "0aa52af9101742ae5d5a1380f7f2e8a4f1f58803806fb6094372d33c78103020"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Decode keystore to workspace signing/
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signing/swapku-tetap.keystore
          ls -l signing/swapku-tetap.keystore

      - name: HARD GATE - keystore fingerprint
        run: |
          set -e
          FP=$(keytool -list -v -keystore signing/swapku-tetap.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
          echo "Keystore fingerprint found: $FP"
          echo "Keystore fingerprint expected: $EXPECTED_KEYSTORE_FP"
          if [ "$FP" != "$EXPECTED_KEYSTORE_FP" ]; then
            echo "FATAL: keystore fingerprint mismatch. Build stopped before compiling."
            exit 1
          fi
          echo "Keystore fingerprint gate PASSED."

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: HARD GATE - APK certificate
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FATAL: APK not found at $APK"
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -n 1)
          echo "Using apksigner: $APKSIGNER"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}')
          echo "APK certificate found: $CERT"
          echo "APK certificate expected: $EXPECTED_APK_CERT"
          if [ "$CERT" != "$EXPECTED_APK_CERT" ]; then
            echo "FATAL: APK certificate mismatch. Nothing will be published."
            exit 1
          fi
          echo "APK certificate gate PASSED."

      - name: Upload build.log to build-log release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            gh release view build-log >/dev/null 2>&1 || gh release create build-log --title "build-log" --notes "SwapKu build logs" --prerelease || true
            gh release upload build-log build.log --clobber || true
          else
            echo "No build.log to upload."
          fi

      - name: Publish APK to rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SwapKu-v1.0.0.apk
          ls -l SwapKu-v1.0.0.apk
          sha256sum SwapKu-v1.0.0.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "latest" --notes "SwapKu rolling latest" || true
          gh release upload latest SwapKu-v1.0.0.apk --clobber
