plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreFile = rootProject.file("signing/swapku-tetap.keystore")

android {
    namespace 'com.daftech.swapku'
    compileSdk 34

    defaultConfig {
        applicationId 'com.daftech.swapku'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary = true
        }
        // Target device is arm64 (Redmi Note 10S). Keep the APK lean.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        tetap {
            storeFile keystoreFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.tetap
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.tetap
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.15'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // CameraX 1.3.4: Preview + ImageCapture + VideoCapture (plain recording only).
    // VideoCapture records the UNPROCESSED stream. Swapped video is made
    // afterwards by VideoProcessor (record-then-process), never by pretending
    // the preview is the recording.
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.camera:camera-video:1.3.4'

    // ML Kit face detection, bundled model. Detection ONLY.
    // ML Kit does NOT produce face embeddings. Embeddings come from the
    // ArcFace ONNX model in FaceSwapEngine, never from ML Kit.
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // ONNX Runtime Android, full package (all ops), CPU-first.
    // Version 1.31.1 is the version seen in the research report on Maven Central.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
}
